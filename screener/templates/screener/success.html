<!DOCTYPE html>
<html>
<head>
    <title>Application Results</title>
</head>
<body>
    <h1>Thank you, {{ candidate.name }}!</h1>
    <p>Your resume has been analyzed. Here's how you matched against the job description:</p>

    <h2>Match Score: {{ candidate.ai_score }} / 100</h2>

    <h3>Feedback:</h3>

    <a href="{% url 'upload_resume' %}">Submit another resume</a>
</body>
</html>
