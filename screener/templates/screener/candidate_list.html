<!DOCTYPE html>
<html>
<head>
    <title>Candidate Rankings</title>
</head>
<body>
    <h1>Candidate Rankings</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Email</th>
            <th>AI Score</th>
            <th>AI Feedback</th>
            <th>Resume</th>
        </tr>
        {% for candidate in candidates %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ candidate.name }}</td>
            <td>{{ candidate.email }}</td>
            <td>{{ candidate.ai_score }}</td>
            <td>{{ candidate.ai_feedback }}</td>
            <td><a href="{{ candidate.resume_file.url }}" target="_blank">View</a></td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No scored candidates yet.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
